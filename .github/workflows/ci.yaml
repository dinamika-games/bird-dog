name: Continuous integration

# NOTE (mristin):
# We run the same checks as before a commit (dev/continuous_integration/precommit.py):
# the formatting, the linting, the translations, the C# unit tests, the type-checks
# of the GDScripts, the Godot tests and the smoke start of the scenes. The render
# tests need a display, so precommit.py skips them here.

on:
  pull_request:
  push:
    branches:
      - main

env:
  GODOT_VERSION: 4.6.2

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # NOTE (mristin):
          # The ONNX models and the test images are in LFS.
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the development tools
        run: python -m pip install -r dev/requirements.txt

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/godot
          key: godot-${{ env.GODOT_VERSION }}-mono-linux-x86_64

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --silent --show-error --output godot.zip \
            "${base}/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q godot.zip -d "${{ runner.temp }}/godot"
          rm godot.zip

      - name: Install Godot
        run: |
          echo "GODOT=${{ runner.temp }}/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore BirdDog.sln

      - name: Run the pre-commit checks
        run: python dev/continuous_integration/precommit.py --jobs 4
